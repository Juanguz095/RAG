services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag_medical
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_secure_pass}
    ports: ["5555:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_medical"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]

  api:
    build: .
    image: rag-api:latest
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    mem_limit: 3g
    volumes:
      - ./src:/app/src
      - ./frontend:/app/frontend:ro
      - ./models:/models:ro
      - ./uploads:/app/uploads
      - ./hf_cache:/home/appuser/.cache/huggingface
    environment:
      - DATABASE_URL=postgresql+asyncpg://rag_user:rag_secure_pass@postgres:5432/rag_medical
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=${MINIO_PASSWORD:-minioadmin}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - AUTH_REQUIRED=${AUTH_REQUIRED:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - EMBED_MODEL_NAME=${EMBED_MODEL_NAME:-BAAI/bge-m3}
      - OCR_ENGINE=${OCR_ENGINE:-tesseract}
      - PERFIL=${PERFIL:-calidad}
      - LLM_MODEL_PATH=${LLM_MODEL_PATH:-}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-256}
      - CONTEXT_MAX_CHARS=${CONTEXT_MAX_CHARS:-4000}
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      minio: { condition: service_started }

  worker:
    build: .
    image: rag-api:latest
    command: celery -A src.workers.celery_app worker -Q ingest,celery -c 1 --loglevel=info
    mem_limit: 4.5g
    volumes:
      - ./src:/app/src
      - ./models:/models:ro
      - ./uploads:/app/uploads
      - ./hf_cache:/home/appuser/.cache/huggingface
    environment:
      - DATABASE_URL=postgresql+asyncpg://rag_user:rag_secure_pass@postgres:5432/rag_medical
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=${MINIO_PASSWORD:-minioadmin}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - AUTH_REQUIRED=false
      - WORKER_QUEUES=ingest,celery
      - OCR_ENGINE=${OCR_ENGINE:-tesseract}
      - EMBED_MODEL_NAME=${EMBED_MODEL_NAME:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - RERANK_MODEL_NAME=${RERANK_MODEL_NAME:-BAAI/bge-reranker-base}
    depends_on: [redis, postgres, minio]

  # Separate queue: LLM extract must never block new uploads (OCR/embeddings)
  worker-extract:
    build: .
    image: rag-api:latest
    command: celery -A src.workers.celery_app worker -Q extract -c 1 --loglevel=info
    mem_limit: 2g
    volumes:
      - ./src:/app/src
      - ./models:/models:ro
      - ./uploads:/app/uploads
      - ./hf_cache:/home/appuser/.cache/huggingface
    environment:
      - DATABASE_URL=postgresql+asyncpg://rag_user:rag_secure_pass@postgres:5432/rag_medical
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=${MINIO_PASSWORD:-minioadmin}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - AUTH_REQUIRED=false
      - WORKER_QUEUES=extract
    depends_on: [redis, postgres, minio]

volumes:
  postgres_data:
  minio_data:
