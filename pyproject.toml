[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "rag-medical"
version = "2.0.0"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "pydantic-settings>=2.0",
    "python-multipart",
    "redis>=5.0",
    "celery>=5.4",
    "minio>=7.2",
    "alembic>=1.13",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "tiktoken>=0.7",
    "PyJWT>=2.8",
    "sentence-transformers>=3.1",
    "torch>=2.4",
    "llama-cpp-python>=0.3",
    "pytesseract>=0.3.10",
    "numpy>=1.26",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "reportlab>=4.0",   # reporte ejecutivo BSC (PDF, RAG-052)
    "openpyxl>=3.1",    # reporte ejecutivo BSC (XLSX, RAG-052)
]

[project.optional-dependencies]
# OCR alternativo (OCR_ENGINE=paddle): pesado; no va en la imagen base.
paddle = ["paddlepaddle>=2.6", "paddleocr>=2.7,<3"]
