<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar Sesión - RAG Médico</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
          </svg>
        </div>
        <h1>RAG Médico Local</h1>
        <p>Sistema de búsqueda y análisis de documentos médicos</p>
      </div>

      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input class="form-input" type="text" id="username" name="username" placeholder="Tu usuario" required autofocus>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input class="form-input" type="password" id="password" name="password" placeholder="Tu contraseña" required>
        </div>
        <button class="login-btn" type="submit" id="loginBtn">Iniciar Sesión</button>
        <div class="login-error" id="loginError"></div>
      </form>

      <div class="login-footer">
        <p>Sistema 100% local y privado</p>
      </div>
    </div>
  </div>

  <script src="/static/js/auth.js"></script>
  <script>
    if (Auth.isLoggedIn()) {
      window.location.href = '/';
    }

    const form = document.getElementById('loginForm');
    const btn = document.getElementById('loginBtn');
    const errorDiv = document.getElementById('loginError');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Ingresando...';

      try {
        const response = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
          }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || 'Credenciales inválidas');
        }

        Auth.saveLogin(data.access_token, data.user);
        window.location.href = '/';
      } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Iniciar Sesión';
      }
    });
  </script>
</body>
</html>
