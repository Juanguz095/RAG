[project]
name = "rag-medical"
version = "0.1.0"
description = "Sistema RAG médico local con OCR avanzado y LLM privado"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy[asyncio]==2.0.34",
    "asyncpg==0.29.0",
    "pgvector==0.2.5",
    "pydantic-settings==2.5.2",
    "pydantic==2.9.2",
    "python-multipart==0.0.9",
    "redis==5.0.8",
    "celery==5.4.0",
    "minio==7.2.10",
    "alembic==1.13.1",
    "prometheus-client==0.19.0",
    "httpx==0.27.2",
    "python-dotenv==1.0.1",
    "flagembedding==1.2.11",
    "peft==0.12.0",
    "transformers==4.44.2",
    "pillow==10.4.0",
    "pymupdf==1.24.8",
    "pytesseract==0.3.13",
    "tiktoken==0.7.0",
    "PyJWT==2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "faker==33.1.0",
    "factory-boy==3.3.0",
    "ruff==0.6.3",
    "mypy==1.11.2",
    "pre-commit==3.8.0",
]

llm = [
    "llama-cpp-python==0.3.21",
]

ml = [
    "torch==2.4.0",
]

ocr = [
    "surya-ocr==0.5.0",
    "marker-pdf==0.2.17",
    "paddlepaddle==2.6.2",
    "paddleocr==2.8.1",
]

ner = [
    "spacy==3.7.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: requires PostgreSQL, Redis, MinIO or local models",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "PT"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
follow_imports = "skip"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
